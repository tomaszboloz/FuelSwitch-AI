name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test (macOS)
    # Package.swift declares swift-tools-version 6.0, which needs Xcode 16+.
    # macos-14 runners default to Xcode 15.x (Swift 5.10) and don't reliably
    # carry an Xcode 16 install, so only macos-15 is used here.
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Verify Swift Toolchain
        run: swift --version

      - name: Verify Legacy Naming Ban
        run: |
          echo "Scanning for banned legacy naming patterns..."
          BANNED=$(echo "aGVhZHJvb20=" | base64 --decode)
          if grep -ri --exclude-dir=.git --exclude-dir=.build --exclude=README.md "$BANNED" .; then
            echo "ERROR: Banned legacy naming detected!"
            exit 1
          fi
          echo "Repository naming audit passed: 0 occurrences."

      - name: Run Swift Tests
        run: swift test --parallel

      - name: Test update publication safeguards
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Build Application Bundle
        run: make app
